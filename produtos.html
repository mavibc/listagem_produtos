
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Produtos | Dai Couto Cosméticos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #fff9fa;
            color: #45383c;
        }

        /* Cabeçalho */
        .cabecalho {
            background-color: #ffffff;
            padding: 22px 0;
            border-bottom: 1px solid #f3e5e9;
        }

        .logo {
            color: #bd718a;
            font-size: 25px;
            font-weight: 700;
            margin: 0;
        }

        .subtitulo {
            color: #997d86;
            font-size: 13px;
            margin-top: 4px;
        }

        /* Conteúdo */
        .conteudo {
            padding-top: 55px;
            padding-bottom: 60px;
        }

        .titulo {
            font-size: 30px;
            font-weight: 700;
            color: #563e48;
            margin-bottom: 10px;
        }

        .descricao {
            color: #99868d;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Busca */
        .busca-container {
            position: relative;
            max-width: 600px;
            margin-bottom: 35px;
        }

        .busca-container input {
            width: 100%;
            padding: 15px 20px;
            padding-left: 48px;
            border: 1px solid #ead6de;
            border-radius: 12px;
            background-color: white;
            outline: none;
            font-size: 14px;
        }

        .busca-container input:focus {
            border-color: #c77f98;
            box-shadow: 0 0 0 3px #f5e3e9;
        }

        .icone-busca {
            position: absolute;
            left: 17px;
            top: 14px;
            font-size: 19px;
        }

        /* Quantidade */
        .quantidade {
            color: #987d87;
            font-size: 13px;
            margin-bottom: 20px;
        }

        /* Cards */
        .card-produto {
            background: white;
            border: 1px solid #f1e5e9;
            border-radius: 15px;
            overflow: hidden;
            height: 100%;
            transition: 0.3s;
        }

        .card-produto:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 22px rgba(130, 80, 100, 0.12);
        }

        .imagem-produto {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: #f9edf1;
        }

        .card-conteudo {
            padding: 20px;
        }

        .nome-produto {
            font-size: 16px;
            font-weight: 600;
            color: #563e48;
            margin-bottom: 12px;
        }

        .preco-produto {
            color: #bd718a;
            font-size: 19px;
            font-weight: 700;
            margin: 0;
        }

        /* Produto não encontrado */
        .vazio {
            text-align: center;
            padding: 50px 15px;
            color: #987d87;
        }

        .vazio h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        /* Rodapé */
        footer {
            background: #f7e9ee;
            padding: 22px;
            text-align: center;
            color: #987d87;
            font-size: 13px;
        }

        @media (max-width: 576px) {
            .titulo {
                font-size: 25px;
            }

            .conteudo {
                padding-top: 35px;
            }

            .imagem-produto {
                height: 190px;
            }
        }
    </style>
</head>

<body>

    
    <header class="cabecalho">
        <div class="container">
            <h1 class="logo">Dai Couto Cosméticos</h1>
            <p class="subtitulo">Beleza, cuidado e autoestima.</p>
        </div>
    </header>


    <main class="container conteudo">

        <h2 class="titulo">Nossos produtos</h2>

        <p class="descricao">
            Encontre seus produtos favoritos de beleza e cuidados.
        </p>


        <div class="busca-container">

            <span class="icone-busca">⌕</span>

            <input
                type="text"
                id="campoBusca"
                placeholder="O que você está procurando?"
            >

        </div>

        <p class="quantidade" id="quantidadeProdutos"></p>

      <div class="row g-4" id="listaProdutos"></div>

        <
        <div class="vazio" id="mensagemVazia" hidden>
            <h3>Nenhum produto encontrado</h3>
            <p>Tente pesquisar por outro nome.</p>
        </div>

    </main>


    <footer>
        Dai Couto Cosméticos | Todos os direitos reservados.
    </footer>

    <script>

      
        const produtos = [

            {
                nome: "Shampoo",
                preco: 29.90,
                imagem: "https://placehold.co/500x350/f7e6ec/9b6077?text=Shampoo"
            },

            {
                nome: "Condicionador",
                preco: 34.90,
                imagem: "https://placehold.co/500x350/f7e6ec/9b6077?text=Condicionador"
            },

            {
                nome: "Creme Hidratante",
                preco: 39.90,
                imagem: "https://placehold.co/500x350/f7e6ec/9b6077?text=Creme+Hidratante"
            },

            {
                nome: "Máscara Capilar",
                preco: 45.90,
                imagem: "https://placehold.co/500x350/f7e6ec/9b6077?text=Mascara+Capilar"
            },

            {
                nome: "Óleo Capilar",
                preco: 25.90,
                imagem: "https://placehold.co/500x350/f7e6ec/9b6077?text=Oleo+Capilar"
            },

            {
                nome: "Protetor Solar",
                preco: 49.90,
                imagem: "https://placehold.co/500x350/f7e6ec/9b6077?text=Protetor+Solar"
            }

        ];

        const listaProdutos = document.getElementById("listaProdutos");

        const campoBusca = document.getElementById("campoBusca");

        const mensagemVazia = document.getElementById("mensagemVazia");

        const quantidadeProdutos = document.getElementById("quantidadeProdutos");

        function removerAcentos(texto) {

            return texto
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .toLowerCase()
                .trim();

        }

        function listarProdutos(lista) {

            listaProdutos.innerHTML = "";

            quantidadeProdutos.textContent =
                `${lista.length} produto(s) encontrado(s)`;

            mensagemVazia.hidden = lista.length !== 0;

            lista.forEach(produto => {

                listaProdutos.innerHTML += `

                    <div class="col-12 col-sm-6 col-lg-4">

                        <div class="card-produto">

                            <img
                                src="${produto.imagem}"
                                class="imagem-produto"
                                alt="${produto.nome}"
                            >

                            <div class="card-conteudo">

                                <h3 class="nome-produto">
                                    ${produto.nome}
                                </h3>

                                <p class="preco-produto">
                                    R$ ${produto.preco.toFixed(2).replace(".", ",")}
                                </p>

                            </div>

                        </div>

                    </div>

                `;

            });

        }


       
        campoBusca.addEventListener("input", function () {

            const pesquisa = removerAcentos(campoBusca.value);

            const resultado = produtos.filter(produto =>

                removerAcentos(produto.nome).includes(pesquisa)

            );

            listarProdutos(resultado);

        });


        listarProdutos(produtos);

    </script>

</body>
</html>
